name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/ci.yml@v2
    with:
      os-matrix: '["ubuntu-latest"]'
      # The floor is executed - min(floor(executed * 0.05), 10), read from the
      # run's JUnit artifact (pwsh-module-ci docs/test-integrity.md, ADR-0004).
      # Re-derive it in any PR that adds or removes tests: raise it when tests
      # are added, and lower it only when tests are deliberately deleted.
      min-tests: 197 # 207 executed at 95ef3cf (0 disabled); margin min(floor(207 * 0.05), 10) = 10; 207 - 10 = 197
    permissions:
      contents: read
      checks: write
