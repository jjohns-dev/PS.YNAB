name: release
run-name: release ${{ github.ref_name }}

on:
  pull_request:
    branches: ["*"]
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # v0.1.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/release.yml@v2
    with:
      artifact-name: ${{ github.event_name == 'pull_request' && 'PS.YNAB-dry-run' || format('PS.YNAB-{0}', github.ref_name) }}
      dry-run: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
